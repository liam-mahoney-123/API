<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - Debug Version</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>♔ Chess Game ♛</h1>
        
        <div class="game-info">
            <div class="current-player">
                <span id="current-player">White's Turn</span>
            </div>
            <div class="game-status">
                <span id="game-status">Game in Progress</span>
            </div>
        </div>

        <div class="chess-board" id="chess-board">
            <!-- Chess board will be generated by JavaScript -->
        </div>

        <div class="controls">
            <button id="new-game-btn" onclick="startNewGame()">New Game</button>
            <button id="undo-btn" onclick="undoMove()">Undo Move</button>
            <button onclick="debugGame()">Debug Info</button>
        </div>

        <div class="move-history">
            <h3>Move History</h3>
            <div id="move-list"></div>
        </div>

        <div id="debug-info" style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
            <h4>Debug Information:</h4>
            <div id="debug-output">Click "Debug Info" to see game state</div>
        </div>
    </div>

    <script>
        // Add error handling and debugging
        window.addEventListener('error', function(e) {
            console.error('JavaScript Error:', e.error);
            document.getElementById('debug-output').innerHTML += '<br><strong>Error:</strong> ' + e.error.message;
        });

        function debugGame() {
            const debugOutput = document.getElementById('debug-output');
            let info = '<strong>Game Debug Info:</strong><br>';
            
            if (typeof game !== 'undefined' && game) {
                info += 'Game exists: Yes<br>';
                info += 'Current player: ' + game.currentPlayer + '<br>';
                info += 'Game status: ' + game.gameStatus + '<br>';
                info += 'Board element exists: ' + (document.getElementById('chess-board') ? 'Yes' : 'No') + '<br>';
                info += 'Board squares count: ' + document.querySelectorAll('.square').length + '<br>';
            } else {
                info += 'Game exists: No<br>';
            }
            
            info += 'ChessGame class defined: ' + (typeof ChessGame !== 'undefined' ? 'Yes' : 'No') + '<br>';
            
            debugOutput.innerHTML = info;
        }
    </script>
    <script src="chess.js"></script>
</body>
</html>
